<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Vídeo Publicitário Germana Zocrato</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, #0d382c 0%, #041f17 45%, #020f0b 100%);
      color: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 70px 40px 60px 40px;
    }

    /* Partículas e brilhos de fundo */
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
    }
    .glow-1 {
      width: 500px;
      height: 500px;
      background: rgba(212, 175, 55, 0.15);
      top: 15%;
      left: 10%;
    }
    .glow-2 {
      width: 600px;
      height: 600px;
      background: rgba(16, 185, 129, 0.12);
      bottom: 15%;
      right: 10%;
    }

    /* Cabeçalho do Anúncio */
    .header-box {
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 900px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 9999px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #facc15;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .main-title {
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 40%, #e2e8f0 70%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 26px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .stars-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 22px;
      color: #facc15;
      font-weight: 600;
    }

    /* Container do iPhone 16 Pro */
    .phone-container {
      position: relative;
      z-index: 10;
      width: 580px;
      height: 1180px;
      background: #09090b;
      border-radius: 56px;
      padding: 14px;
      box-shadow:
        0 0 0 4px #27272a,
        0 0 0 6px #18181b,
        0 25px 70px rgba(0, 0, 0, 0.95),
        0 0 60px rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 35px;
      background: #000000;
      border-radius: 20px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 18px;
    }
    .camera-lens {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid #1e293b;
    }

    /* Tela interna do celular com o iframe */
    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      background: #ffffff;
      position: relative;
    }

    .phone-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Rodapé com Call To Action */
    .footer-box {
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 820px;
      height: 85px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #052218;
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 35px rgba(234, 179, 8, 0.45);
      border: 2px solid #fef08a;
      animation: pulseBtn 2s infinite ease-in-out;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 35px rgba(234, 179, 8, 0.45); }
      50% { transform: scale(1.03); box-shadow: 0 15px 50px rgba(234, 179, 8, 0.7); }
    }

    .site-url {
      font-size: 24px;
      color: #cbd5e1;
      font-weight: 600;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-url span {
      color: #facc15;
    }
  </style>
</head>
<body>
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>

  <!-- Header Superior -->
  <div class="header-box">
    <div class="badge-pill">✨ Posicionamento VIP Digital</div>
    <h1 class="main-title">GERMANA ZOCRATO</h1>
    <p class="subtitle">Drenagem Linfática & Pós-Operatório Especializado</p>
    <div class="stars-badge">
      ★★★★★ <span>Atendimento Clínico & Home Care</span>
    </div>
  </div>

  <!-- Chassi iPhone 16 Pro com Site Ativo -->
  <div class="phone-container">
    <div class="dynamic-island">
      <div class="camera-lens"></div>
    </div>
    <div class="phone-screen">
      <iframe id="site-frame" src="https://biovip.com.br/germanazocrato/"></iframe>
    </div>
  </div>

  <!-- Rodapé de Conversão -->
  <div class="footer-box">
    <div class="cta-btn">
      <span>Agende sua Sessão pelo WhatsApp</span>
      <span style="font-size: 32px;">💬</span>
    </div>
    <div class="site-url">
      Acesse: <span>biovip.com.br/germanazocrato</span>
    </div>
  </div>
</body>
</html>
