<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Dark luxury ambient background -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1913" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0c0b0a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070708" stop-opacity="1" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="25%" stop-color="#E5C17B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C1E" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>

    <!-- Animated Shimmer Gradient (GIF effect) -->
    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#FDF3DE" stop-opacity="1">
        <animate attributeName="offset" values="-0.3; 1.3" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1">
        <animate attributeName="offset" values="-0.15; 1.45" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#D4AF37" stop-opacity="0.9">
        <animate attributeName="offset" values="0.0; 1.6" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#AA7C1E" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes sweepShine {
        0% { transform: translateX(-120px) rotate(25deg); opacity: 0; }
        30% { opacity: 0.6; }
        60% { transform: translateX(350px) rotate(25deg); opacity: 0; }
        100% { transform: translateX(350px) rotate(25deg); opacity: 0; }
      }
      .shimmer-bar {
        animation: sweepShine 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.4)); }
        50% { filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.8)); }
      }
      .pulsing-crown {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      .floating-emblem {
        animation: floatSoft 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="url(#bgGlow)" rx="16" />

  <!-- EMBLEM GROUP (Centered) -->
  <g class="floating-emblem" transform="translate(500, 160)">
    
    <!-- Laurel Leaves (Left side) -->
    <g stroke="url(#shimmerGradient)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main stem -->
      <path d="M -15 65 C -45 55, -75 25, -72 -20 C -70 -48, -55 -68, -45 -82" />
      
      <!-- Leaf 1 (bottom) -->
      <path d="M -22 55 Q -40 60 -48 48 Q -40 38 -25 45 Z" fill="url(#goldGradient)" fill-opacity="0.25" />
      <!-- Leaf 2 -->
      <path d="M -40 38 Q -62 42 -70 28 Q -58 20 -44 28 Z" fill="url(#goldGradient)" fill-opacity="0.3" />
      <!-- Leaf 3 -->
      <path d="M -56 16 Q -82 18 -88 2 Q -74 -6 -58 6 Z" fill="url(#goldGradient)" fill-opacity="0.35" />
      <!-- Leaf 4 (mid) -->
      <path d="M -68 -8 Q -95 -8 -98 -24 Q -82 -30 -68 -18 Z" fill="url(#goldGradient)" fill-opacity="0.4" />
      <!-- Leaf 5 -->
      <path d="M -70 -34 Q -95 -40 -92 -56 Q -78 -58 -66 -42 Z" fill="url(#goldGradient)" fill-opacity="0.45" />
      <!-- Leaf 6 -->
      <path d="M -62 -58 Q -82 -68 -76 -84 Q -62 -82 -54 -68 Z" fill="url(#goldGradient)" fill-opacity="0.45" />
      <!-- Leaf 7 (top tip) -->
      <path d="M -46 -80 Q -58 -96 -50 -106 Q -38 -100 -36 -86 Z" fill="url(#goldGradient)" fill-opacity="0.5" />
    </g>

    <!-- Smartphone Body (Center) -->
    <g>
      <!-- Phone Outer Frame -->
      <rect x="-42" y="-88" width="84" height="152" rx="18" fill="#0c0b0e" stroke="url(#shimmerGradient)" stroke-width="3" />
      
      <!-- Top Speaker Notch -->
      <rect x="-14" y="-78" width="28" height="4.5" rx="2.25" fill="url(#goldGradient)" />
      
      <!-- Bottom Indicator Bar -->
      <line x1="-16" y1="52" x2="16" y2="52" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />

      <!-- MONOGRAM 'VB' (Interlocking Luxury Serif) -->
      <g id="monogramVB" transform="translate(0, -6)">
        <!-- Letter V -->
        <path d="M -22 -26 L -14 -26 L -3 10 L 1 10 L 11 -26 L 19 -26 L 6 18 L -9 18 Z" 
              fill="url(#shimmerGradient)" filter="url(#goldGlow)" />
        
        <!-- Letter B -->
        <path d="M -8 -22 L 12 -22 C 19 -22, 24 -18, 24 -11 C 24 -6, 20 -2, 16 -1 C 22 0, 26 5, 26 12 C 26 20, 20 24, 11 24 L -8 24 Z
                 M -2 -16 L -2 -4 L 10 -4 C 14 -4, 17 -6, 17 -10 C 17 -14, 14 -16, 10 -16 Z
                 M -2 2 L -2 18 L 11 18 C 15 18, 19 16, 19 10 C 19 4, 15 2, 11 2 Z" 
              fill="url(#shimmerGradient)" />
      </g>
    </g>

    <!-- Luxury Royal Crown (Top Right) -->
    <g class="pulsing-crown" transform="translate(38, -68) rotate(12)">
      <!-- 5-Point Crown -->
      <path d="M -26 14 L -28 -4 L -14 4 L 0 -12 L 14 4 L 28 -4 L 26 14 Z" 
            fill="none" stroke="url(#shimmerGradient)" stroke-width="2.8" stroke-linejoin="round" />
      <path d="M -26 14 L 26 14 L 24 18 L -24 18 Z" fill="url(#goldGradient)" />
      
      <!-- Crown Pearls/Jewels on tips -->
      <circle cx="-28" cy="-4" r="2.5" fill="#FFF8E7" />
      <circle cx="-14" cy="4" r="2" fill="#FFF8E7" />
      <circle cx="0" cy="-12" r="3" fill="#FFF8E7" />
      <circle cx="14" cy="4" r="2" fill="#FFF8E7" />
      <circle cx="28" cy="-4" r="2.5" fill="#FFF8E7" />
    </g>

    <!-- Conversion Chain Link & Digital Network Nodes (Right & Bottom Right) -->
    <g transform="translate(25, 25)">
      <!-- Network connecting nodes -->
      <line x1="8" y1="-30" x2="38" y2="-44" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />
      <circle cx="38" cy="-44" r="4.5" fill="url(#goldGradient)" />
      <circle cx="38" cy="-44" r="2" fill="#FFFFFF" />

      <line x1="-24" y1="-40" x2="-45" y2="-52" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="-45" cy="-52" r="3.5" fill="url(#goldGradient)" />

      <!-- Angled Chain Link (Link na Bio) -->
      <g transform="translate(32, 16) rotate(-35)">
        <rect x="-14" y="-8" width="28" height="16" rx="8" fill="none" stroke="url(#shimmerGradient)" stroke-width="3" />
        <rect x="2" y="-8" width="28" height="16" rx="8" fill="none" stroke="url(#shimmerGradient)" stroke-width="3" />
        
        <!-- Connecting network node dot -->
        <line x1="28" y1="0" x2="42" y2="12" stroke="url(#goldGradient)" stroke-width="2" />
        <circle cx="42" cy="12" r="4" fill="url(#goldGradient)" />
      </g>
    </g>

    <!-- Shimmering shine overlay clip -->
    <g opacity="0.4" style="mix-blend-mode: overlay;">
      <circle cx="0" cy="0" r="110" fill="none" stroke="url(#shimmerGradient)" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
    </g>
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(500, 395)" text-anchor="middle">
    <!-- Main Title: BIOVIP -->
    <text y="0" 
          font-family="'Playfair Display', 'Cinzel', 'Didot', 'Bodoni MT', 'Georgia', serif" 
          font-size="78" 
          font-weight="900" 
          letter-spacing="12" 
          fill="url(#shimmerGradient)" 
          filter="url(#goldGlow)">
      BIOVIP
    </text>

    <!-- Subtitle: MICROSITES DE ALTA CONVERSÃO -->
    <text y="48" 
          font-family="'Montserrat', 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="16.5" 
          font-weight="700" 
          letter-spacing="8" 
          fill="#D6BA82">
      MICROSITES DE ALTA CONVERSÃO
    </text>

    <!-- Elegant decorative baseline -->
    <line x1="-180" y1="68" x2="180" y2="68" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="0" cy="68" r="3" fill="url(#goldGradient)" />
    <circle cx="-180" cy="68" r="2" fill="url(#goldGradient)" />
    <circle cx="180" cy="68" r="2" fill="url(#goldGradient)" />
  </g>
</svg>
