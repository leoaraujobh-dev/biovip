<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="pwaBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1f1a14" />
      <stop offset="60%" stop-color="#0c0b0a" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <linearGradient id="pwaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="25%" stop-color="#E5C17B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#9A7016" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>

    <linearGradient id="pwaAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#pwaBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#pwaGold)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Center Group -->
  <g transform="translate(256, 256)">
    <!-- Ambient Gold Glow Ring -->
    <circle r="160" fill="none" stroke="url(#pwaGold)" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />
    <circle r="185" fill="none" stroke="url(#pwaGold)" stroke-width="1" stroke-opacity="0.1" />

    <!-- Crown on top -->
    <g transform="translate(0, -112)" filter="url(#pwaGlow)">
      <path d="M -36 12 L -28 -14 L -10 2 L 0 -22 L 10 2 L 28 -14 L 36 12 Z" fill="url(#pwaGold)" />
      <circle cx="-28" cy="-18" r="3.5" fill="#FFF" />
      <circle cx="0" cy="-26" r="4.5" fill="#FFF" />
      <circle cx="28" cy="-18" r="3.5" fill="#FFF" />
      <rect x="-36" y="14" width="72" height="4" rx="2" fill="url(#pwaAccent)" />
    </g>

    <!-- Luxury Interlocking Monogram: 'B' & 'V' -->
    <g filter="url(#pwaGlow)">
      <!-- Stylized Monogram V -->
      <path d="M -80 -40 L -45 -40 L -15 65 L 0 65 L 30 -40 L 65 -40 L 15 95 L -30 95 Z" fill="url(#pwaGold)" />
      
      <!-- Stylized Monogram B overlay -->
      <path d="M -35 -40 H 25 C 55 -40 75 -20 75 0 C 75 14 65 25 50 30 C 70 35 80 50 80 72 C 80 95 58 112 25 112 H -35 Z M -12 -18 V 18 H 22 C 34 18 45 12 45 0 C 45 -12 34 -18 22 -18 Z M -12 40 V 88 H 25 C 40 88 52 80 52 64 C 52 48 40 40 25 40 Z" 
            fill="none" stroke="url(#pwaAccent)" stroke-width="14" stroke-linejoin="round" />
    </g>

    <!-- Brand Name text: BIOVIP -->
    <text x="0" y="170" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="800" font-size="34" letter-spacing="10" fill="url(#pwaGold)">BIOVIP</text>
    <text x="0" y="196" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="600" font-size="12" letter-spacing="8" fill="#FBBF24" fill-opacity="0.8">STUDIO</text>
  </g>
</svg>
