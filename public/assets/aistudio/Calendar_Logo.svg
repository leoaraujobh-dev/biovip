<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Calendar Body -->
  <rect x="80" y="140" width="352" height="308" rx="32" fill="none" stroke="currentColor" stroke-width="32"/>
  <path d="M80 220 h352" stroke="currentColor" stroke-width="28"/>
  <!-- Pins -->
