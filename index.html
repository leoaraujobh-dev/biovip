    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && !desc.set && desc.configurable) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () { return currentFetch; },
              set: function (fn) { if (typeof fn === 'function') currentFetch = fn; }
            });
          }
        } catch (e) {}
        window.addEventListener('error', function (event) {
          if (
            (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var stack = event && event.reason && event.reason.stack ? String(event.reason.stack) : '';
          if (stack.indexOf('chrome-extension://') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
